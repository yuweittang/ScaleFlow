name: ScaleFlow CI

on: 
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 12

        steps:
            - name: Download repository
              uses: actions/checkout@v6

            - name: Set up Java 21
              uses: actions/setup-java@v5

              with: 
                distribution: temurin
                java-version: "21"
                cache: maven
            
            - name: Start PostgreSQL and Kafka
              run: docker compose up -d postgres kafka
            - name: Wait for PostgreSQL
              run: |
                timeout 90s bash -c '
                    until docker compose exec -T postgres pg_isready -U postgres -d scaleflow; do
                        sleep 2
                done
                '
            
            - name: Wait for Kafka
              run : |
                timeout 120s bash -c '
                until docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server kafka:29092 --list; do
                    sleep 3
                 done
                '

            - name: Create jobs topic 
              run: |
                docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server kafka:29092 \
                    --create --if-not-exists \
                    --topic jobs \
                    --partitions 3 \
                    --replication-factor 1
                
            - name: Test and build
              env:
                SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/scaleflow
                SPRING_DATASOURCE_USERNAME: postgres
                SPRING_DATASOURCE_PASSWORD: postgres
                SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
              run: mvn --batch-mode --no-transfer-progress clean verify

            - name: Show container logs on failure
              if: failure()
              run: docker compose logs --no-color --tail=100

            - name: Stop containers
              if: always()
              run: docker compose down