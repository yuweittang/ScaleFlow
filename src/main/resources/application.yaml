spring:
  application:
    name: scaleflow

  datasource:
    url: jdbc:postgresql://localhost:5432/scaleflow
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer: 
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: scaleflow-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    
    listener:
      acl-mode: record

    redis:
      host: localhost
      port: 6379
      connect-timeout: 500ms
      timeout: 500ms

server:
  port: 8080
